<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yi听最新音乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lyric-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .lyric-wrapper {
            position: absolute;
            top: 0;
            width: 100%;
            transition: top 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }
        .lyric-line {
            font-size: 3vw;
            line-height: 2.5;
            opacity: 0.6;
            transition: opacity 0.3s ease, font-size 0.3s ease;
        }
        .lyric-line.active {
            opacity: 1;
            color: #409eff;
            font-size: 3.5vw;
        }
        /* 音频控件默认隐藏，调试时可改为opacity:1 */
        audio {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            opacity: 0;
        }
        /* 首次加载提示（可选） */
        .play-tip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2vw;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="lyric-container" id="lyricContainer">
        <div class="lyric-wrapper" id="lyricWrapper"></div>
    </div>
    <div class="play-tip" id="playTip">点击页面播放HE</div>

    <audio id="audioPlayer" controls loop>
        <source src="./saiche.mp3" type="audio/mpeg">
        你的浏览器不支持
    

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const lyricWrapper = document.getElementById('lyricWrapper');
        const playTip = document.getElementById('playTip');
        const containerHeight = document.getElementById('lyricContainer').clientHeight;
        let isPlayInitiated = false; // 标记是否已触发过播放

        // 替换为你的LRC歌词
        const lrcText = `
[00:00.00]YI
[00:01.18]作词：馨
[00:01.48]作曲：懿
[00:17.79]穿过旷野的风
[00:21.50]你慢些走
[00:25.93]我用沉默告诉你
[00:29.84]我醉了酒
[00:34.28]乌兰巴托的夜
[00:38.44]那么静那么静
[00:43.43]连风都听不到
[00:46.73]听不到
[01:07.73]飘向天边的云
[01:11.64]你慢些走
[01:15.90]我用奔跑告诉你
[01:19.92]我不回头
[01:24.42]乌兰巴托的夜
[01:28.48]那么近那么近
[01:33.57]连云都不知道
[01:36.92]不知道
[01:41.44]乌兰巴托的夜
[01:45.25]那么静
[01:50.22]连风都听不到
[01:53.52]我的声音
[01:57.80]乌兰巴托的夜
[02:01.87]那么静
[02:07.05]连云都不知道
[02:10.30]不知道
[02:14.56]乌兰巴托的夜
[02:18.58]那么近那么近
[02:23.55]连风都听不到
[02:26.95]听不到
[02:31.18]乌兰巴托的夜
[02:35.35]那么近那么近
[02:40.27]连云都不知道
[02:43.58]不知道
[02:47.84]乌兰巴托的夜
[02:52.01]那么近那么近
[02:56.89]唱歌的人不时掉眼泪
        `;

        // LRC歌词解析函数
        function parseLrc(lrcStr) {
            const lrcArr = [];
            const regex = /\[(\d{2}):(\d{2})\.(\d{2})\](.*)/g;
            let match;
            while ((match = regex.exec(lrcStr)) !== null) {
                const minutes = parseInt(match[1]);
                const seconds = parseInt(match[2]);
                const milliseconds = parseInt(match[3]);
                const totalTime = minutes * 60 + seconds + milliseconds / 100;
                const text = match[4].trim();
                if (text) lrcArr.push({ time: totalTime, text });
            }
            return lrcArr;
        }

        // 渲染歌词
        const lyricData = parseLrc(lrcText);
        lyricData.forEach(item => {
            const line = document.createElement('div');
            line.className = 'lyric-line';
            line.textContent = item.text;
            lyricWrapper.appendChild(line);
        });
        const lyricLines = document.querySelectorAll('.lyric-line');
        const lineHeight = lyricLines[0]?.clientHeight || 80;
        const centerOffset = (containerHeight - lineHeight) / 2;

        // 歌词滚动与高亮逻辑
        function updateLyric() {
            const currentTime = audioPlayer.currentTime;
            for (let i = 0; i < lyricData.length; i++) {
                const { time } = lyricData[i];
                const nextTime = lyricData[i + 1]?.time || Infinity;
                if (currentTime >= time && currentTime < nextTime) {
                    lyricLines.forEach(line => line.classList.remove('active'));
                    lyricLines[i].classList.add('active');
                    const scrollTop = i * lineHeight - centerOffset;
                    lyricWrapper.style.top = `-${scrollTop}px`;
                    break;
                }
            }
        }

        // 完善自动播放逻辑 - 页面加载后尝试自动播放
        window.addEventListener('load', async () => {
            try {
                await audioPlayer.play();
                isPlayInitiated = true;
                audioPlayer.addEventListener('timeupdate', updateLyric);
            } catch (err) {
                // 浏览器限制自动播放时，显示提示
                playTip.style.opacity = 1;
                // 点击页面任意位置触发播放
                document.addEventListener('click', async () => {
                    if (!isPlayInitiated) {
                        await audioPlayer.play();
                        isPlayInitiated = true;
                        playTip.style.opacity = 0;
                        audioPlayer.addEventListener('timeupdate', updateLyric);
                    }
                }, { once: true }); // 只触发一次点击播放
            }
        });
    </script>
</body>
</html>
