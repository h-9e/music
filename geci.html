<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yi听喜庆音乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lyric-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .lyric-wrapper {
            position: absolute;
            top: 0;
            width: 100%;
            transition: top 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }
        .lyric-line {
            font-size: 3vw;
            line-height: 2.5;
            opacity: 0.6;
            transition: opacity 0.3s ease, font-size 0.3s ease;
        }
        .lyric-line.active {
            opacity: 1;
            color: #409eff;
            font-size: 3.5vw;
        }
        /* 音频控件默认隐藏，调试时可改为opacity:1 */
        audio {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            opacity: 0;
        }
        /* 首次加载提示（可选） */
        .play-tip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2vw;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="lyric-container" id="lyricContainer">
        <div class="lyric-wrapper" id="lyricWrapper"></div>
    </div>
    <div class="play-tip" id="playTip">点击页面播放</div>

    <audio id="audioPlayer" controls loop>
        <source src="GXFC.mp3" type="audio/mpeg">
        你的浏览器不支持
    

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const lyricWrapper = document.getElementById('lyricWrapper');
        const playTip = document.getElementById('playTip');
        const containerHeight = document.getElementById('lyricContainer').clientHeight;
        let isPlayInitiated = false; // 标记是否已触发过播放

        // 替换歌词
        const lrcText = `
[00:00.000]H❤怡 -琴启懿 (HEYi)
[00:08.634]词：勤
[00:15.696]曲：威
[00:25.540]我恭喜你发财
[00:29.168]我恭喜你精彩
[00:32.849]最好的请过来
[00:34.656]不好的请走开
[00:36.592]礼多人不怪
[00:41.985]我祝
[00:42.608]满天下的女孩
[00:43.968]嫁一个好男孩
[00:45.807]俩小口永远在一块
[00:49.231]我祝
[00:49.857]满天下的小孩
[00:51.202]聪明胜过秀才
[00:53.074]智商充满你脑袋
[00:56.418]我祝
[00:57.122]尊敬的姑奶奶
[00:58.536]三十六圈的比赛
[01:00.326]气不喘面容不改
[01:03.697]我祝
[01:04.362]三叔公的买卖
[01:05.776]生意扬名四海
[01:07.632]财运亨通住豪宅
[01:10.765]大摇大摆
[01:14.285]乐天替你消灾
[01:18.450]恭喜发财
[01:22.306]要喊得够豪迈
[01:25.695]恭喜发财
[01:29.215]我恭喜你发财
[01:32.832]我恭喜你精彩
[01:36.431]最好的请过来
[01:38.271]不好的请走开
[01:40.176]礼多人不怪
[02:11.075]我祝
[02:11.776]大家笑口常开
[02:13.039]用心把爱去灌溉
[02:14.873]明天呀我们更厉害
[02:18.265]我祝
[02:18.937]在世界的舞台
[02:20.359]跑得比那黑人更快
[02:22.150]岁岁年年出人才
[02:25.345]大摇大摆
[02:28.977]乐天替你消灾
[02:32.994]恭喜发财
[02:36.929]要喊得够豪迈
[02:40.147]我恭喜你发财
[02:43.713]我恭喜你精彩
[02:47.313]最好的请过来
[02:49.169]不好的请走开
[02:51.105]礼多人不怪
[02:56.510]我恭喜你发财
[03:00.043]我恭喜你精彩
[03:03.720]最好的请过来
[03:05.499]不好的请走开
[03:07.444]礼多人不怪
[03:14.833]恭喜发财
        `;

        // LRC歌词解析函数 - 适配三位毫秒 [mm:ss.xxx]
        function parseLrc(lrcStr) {
            const lrcArr = [];
            const regex = /\[(\d{2}):(\d{2})\.(\d{3})\](.*)/g;
            let match;
            while ((match = regex.exec(lrcStr)) !== null) {
                const minutes = parseInt(match[1]);
                const seconds = parseInt(match[2]);
                const milliseconds = parseInt(match[3]);
                const totalTime = minutes * 60 + seconds + milliseconds / 1000;
                const text = match[4].trim();
                if (text) lrcArr.push({ time: totalTime, text });
            }
            return lrcArr;
        }

        // 渲染歌词
        const lyricData = parseLrc(lrcText);
        lyricData.forEach(item => {
            const line = document.createElement('div');
            line.className = 'lyric-line';
            line.textContent = item.text;
            lyricWrapper.appendChild(line);
        });
        const lyricLines = document.querySelectorAll('.lyric-line');
        const lineHeight = lyricLines[0]?.clientHeight || 80;
        const centerOffset = (containerHeight - lineHeight) / 2;

        // 歌词滚动与高亮逻辑
        function updateLyric() {
            const currentTime = audioPlayer.currentTime;
            for (let i = 0; i < lyricData.length; i++) {
                const { time } = lyricData[i];
                const nextTime = lyricData[i + 1]?.time || Infinity;
                if (currentTime >= time && currentTime < nextTime) {
                    lyricLines.forEach(line => line.classList.remove('active'));
                    lyricLines[i].classList.add('active');
                    const scrollTop = i * lineHeight - centerOffset;
                    lyricWrapper.style.top = `-${scrollTop}px`;
                    break;
                }
            }
        }

        // 完善自动播放逻辑 - 页面加载后尝试自动播放
        window.addEventListener('load', async () => {
            try {
                await audioPlayer.play();
                isPlayInitiated = true;
                audioPlayer.addEventListener('timeupdate', updateLyric);
            } catch (err) {
                // 浏览器限制自动播放时，显示提示
                playTip.style.opacity = 1;
                // 点击页面任意位置触发播放
                document.addEventListener('click', async () => {
                    if (!isPlayInitiated) {
                        await audioPlayer.play();
                        isPlayInitiated = true;
                        playTip.style.opacity = 0;
                        audioPlayer.addEventListener('timeupdate', updateLyric);
                    }
                }, { once: true }); // 只触发一次点击播放
            }
        });
    </script>
</body>
</html>
