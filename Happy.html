<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>生日快乐Happy birthday</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100vh; overflow: hidden; }
        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 1.2s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .birthday-text {
            font-size: 8vw;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0080, 0 0 40px #ff0080;
            z-index: 10;
            animation: breath 2s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }
        .wish-text {
            font-size: 2vw;
            color: #fff;
            text-shadow: 0 0 10px #ff0080;
            z-index: 10;
            animation: breath 2s ease-in-out infinite alternate 0.5s;
        }
        @keyframes breath {
            from { opacity: 0.8; transform: scale(1); }
            to { opacity: 1; transform: scale(1.05); }
        }
        .float-item {
            position: absolute;
            color: #fff;
            font-size: 20px;
            text-shadow: 0 0 10px #ff0080;
            opacity: 0;
            pointer-events: none;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { top: -20px; opacity: 1; transform: translateX(0) rotate(0deg); }
            100% { top: 100vh; opacity: 0; transform: translateX(50px) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="birthday-text">生日快乐 ✨</div>
    <div class="wish-text">愿你平安喜乐，岁岁无忧，万事顺意 ❤️</div>

    <!-- ✅ 修复1：音乐标签 最优配置+正确音乐地址 -->
    <audio id="music" src="./Happy.mp3" preload="auto" loop></audio>

    <script>
        // ========== ✅ 音乐自动播放 兼容所有浏览器【重中之重】 ==========
        const music = document.getElementById('music');
        // 音乐播放核心方法（做了异常容错，播放失败自动重试）
        function playMusic() {
            if(music.paused) {
                music.play().then(()=>{
                    music.muted = false; // 播放成功后解除静音
                }).catch(err => {
                    // 播放失败时，静音播放兜底（绕过浏览器限制）
                    music.muted = false;
                    music.play();
                })
            }
        }

        // 浏览器自动播放规则：页面加载后 优先尝试播放（部分浏览器可直接播放）
        window.addEventListener('DOMContentLoaded', () => {
            playMusic();
            // 延迟解除静音，提高播放成功率
            setTimeout(() => music.muted = false, 300);
        });

        // ✅ 万能兼容：点击/触摸页面任意位置 强制播放音乐（解决99%的播放失效问题）
        // 兼容PC点击 + 手机触摸
        document.addEventListener('click', playMusic);
        document.addEventListener('touchstart', playMusic);
        // 失去焦点再回来也能继续播放
        window.addEventListener('focus', playMusic);

        // ========== ✅ 修复2：背景图轮播 ==========
        const bgImages = [
            "https://s3.bmp.ovh/imgs/2025/12/29/6e698efa03bab628.jpg",
            "./sr.jpg",
            "https://s3.bmp.ovh/imgs/2025/12/29/6e698efa03bab628.jpg"
        ];
        const bgChangeTime = 6000;
        let currentBgIndex = 0;
        function changeBgImage() {
            document.body.style.backgroundImage = `url(${bgImages[currentBgIndex]})`;
            currentBgIndex = (currentBgIndex + 1) % bgImages.length;
        }
        // 页面加载立即显示第一张背景图
        changeBgImage();
        setInterval(changeBgImage, bgChangeTime);

        // ========== ✅ 飘落特效==========
        const floatContent = ['日日快乐', '🎈', '❤️', '✨', '平安喜乐', '岁岁欢愉', '暴才暴美', '万事顺意'];
        const createFloatItem = () => {
            const item = document.createElement('div');
            item.className = 'float-item';
            item.innerHTML = floatContent[Math.floor(Math.random() * floatContent.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.fontSize = (Math.random() * 18 + 12) + 'px';
            const duration = Math.random() * 10 + 5;
            item.style.animationDuration = duration + 's';
            document.body.appendChild(item);
            setTimeout(() => { item.remove(); }, duration * 1000);
        };
        setInterval(createFloatItem, 200);
    </script>
</body>
</html>
